name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  windows-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Windows easy-start ZIP
        run: |
          mkdir release-assets
          python scripts/build_windows_bundle.py \
            --output="release-assets/pdf-to-epub-ocr-${GITHUB_REF_NAME}-windows-easy-start.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-easy-start
          path: release-assets/*.zip
          if-no-files-found: error

  unix-bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Create Linux and macOS bundles
        run: |
          mkdir release-assets
          python scripts/build_unix_bundle.py --platform linux --output "release-assets/pdf-to-epub-ocr-${GITHUB_REF_NAME}-linux.zip"
          python scripts/build_unix_bundle.py --platform macos --output "release-assets/pdf-to-epub-ocr-${GITHUB_REF_NAME}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: unix-bundles
          path: release-assets/*.zip
          if-no-files-found: error

  windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build signed-hash Windows Setup
        shell: powershell
        run: |
          $version = (Get-Content pyproject.toml | Select-String '^version = "([^"]+)"$').Matches.Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag does not match package version." }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw "Inno Setup compiler was not found." }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          & $iscc "/DAppVersion=$version" "/DSourceRoot=$PWD" "/DOutputDirectory=$PWD\release-assets" .\installer\pdf-to-epub.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $installer = Get-Item "release-assets\pdf-to-epub-ocr-v$version-windows-setup.exe"
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding Ascii -Value "$hash  $($installer.Name)"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release-assets/*-windows-setup.exe
            release-assets/*-windows-setup.exe.sha256
          if-no-files-found: error

  koreader-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.57.0
      - name: Verify receiver version matches the release tag
        shell: bash
        run: |
          plugin_version="$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' koreader-plugin/lua/_meta.lua)"
          test "$plugin_version" = "$GITHUB_REF_NAME"
      - name: Test, build, and audit receiver
        working-directory: koreader-plugin
        run: |
          just test
          just package
      - name: Package receiver plugins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for arch in arm-legacy armv7 arm64; do
            output="koreader-plugin/build/pdf-to-epub-receiver-koplugin-${arch}.zip"
            test -f "$output"
            unzip -tq "$output"
            cp "$output" release-assets/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: koreader-plugin
          path: release-assets/*.zip
          if-no-files-found: error

  github-release:
    needs: [build, windows-bundle, windows-installer, unix-bundles, koreader-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi

  pypi:
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pdf-to-epub-ocr
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
