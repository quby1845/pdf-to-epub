name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --editable ".[dev]"
      - run: pdf-to-epub-ocr --version
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -c "import pdf_to_epub; print(pdf_to_epub.__version__)"
      - run: python scripts/build_windows_bundle.py --output build/windows-easy-start.zip

  windows-desktop:
    name: Windows desktop launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test cmd.exe launchers
        shell: cmd
        run: |
          call KURULUM.bat --self-test > installer-self-test.txt
          findstr /x "PDF_TO_EPUB_INSTALLER_OK" installer-self-test.txt
          call PDF-TO-EPUB.bat --self-test > launcher-self-test.txt
          findstr /x "PDF_TO_EPUB_LAUNCHER_OK" launcher-self-test.txt
      - name: Verify installer failures stay diagnosable
        shell: powershell
        run: |
          $output = & cmd.exe /d /c .\KURULUM.bat --failure-self-test 2>&1
          if ($LASTEXITCODE -eq 0) { throw "Simulated installer failure unexpectedly succeeded." }
          if ($output -notcontains "PDF_TO_EPUB_INSTALLER_FAILURE_OK") { throw "Failure path marker was missing: $output" }
          $logPath = Join-Path $env:LocalAppData "PDF-to-EPUB-OCR\logs\install-error.log"
          if (-not (Test-Path $logPath)) { throw "Installer error log was not created." }
          if ((Get-Content -Raw $logPath) -notmatch "simulated installer failure") { throw "Installer error was not persisted." }
          # The non-zero exit is expected above; do not let the Actions shell wrapper reuse it.
          $global:LASTEXITCODE = 0
      - name: Smoke test Windows PowerShell scripts
        shell: powershell
        run: |
          $setupOutput = & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\setup.ps1 -SelfTest
          if ($setupOutput -ne "PDF_TO_EPUB_SETUP_OK") { throw "setup.ps1 self-test failed: $setupOutput" }
          $probeOutput = & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\setup.ps1 -PythonProbeSelfTest
          if ($probeOutput -ne "PDF_TO_EPUB_PYTHON_ALIAS_OK") { throw "Python alias probe failed: $probeOutput" }
          $logicOutput = & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\setup.ps1 -InstallerLogicSelfTest
          if ($logicOutput -ne "PDF_TO_EPUB_INSTALLER_LOGIC_OK") { throw "Installer logic self-test failed: $logicOutput" }
          $launchOutput = & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\launch.ps1 -SelfTest
          if ($launchOutput -ne "PDF_TO_EPUB_LAUNCH_SCRIPT_OK") { throw "launch.ps1 self-test failed: $launchOutput" }
          $maintenanceOutput = & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\installer\maintenance.ps1 -SelfTest
          if ($maintenanceOutput -ne "PDF_TO_EPUB_MAINTENANCE_OK") { throw "maintenance.ps1 self-test failed: $maintenanceOutput" }
      - name: Compile the Windows installer
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw "Inno Setup compiler was not found." }
          New-Item -ItemType Directory -Path build\installer -Force | Out-Null
          & $iscc "/DAppVersion=0.11.2" "/DSourceRoot=$PWD" "/DOutputDirectory=$PWD\build\installer" .\installer\pdf-to-epub.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          if (-not (Test-Path -LiteralPath .\build\installer\pdf-to-epub-ocr-v0.11.2-windows-setup.exe)) { throw "Setup.exe was not created." }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install cryptography platformdirs
      - run: python -m pip install --no-deps .
      - run: python -c "import tkinter; import pdf_to_epub.gui"
      - run: Get-Command pdf-to-epub-gui

  docker:
    name: Docker configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build --target syntax-check .

  unix-desktop:
    name: ${{ matrix.name }} launcher
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux, os: ubuntu-latest, bundle: linux}
          - {name: macOS, os: macos-latest, bundle: macos}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: bash -n setup.sh launch.sh
      - run: ./setup.sh --self-test
      - run: ./launch.sh --self-test
      - run: python scripts/build_unix_bundle.py --platform "${{ matrix.bundle }}" --output "build/${{ matrix.bundle }}.zip"
      - run: test -s "build/${{ matrix.bundle }}.zip"
